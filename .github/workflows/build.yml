name: Build & Release

on:
  push:
    branches: [main, master, stage2]
    tags: ["v*"]
  pull_request:
    branches: [main, master, stage2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            arch: x86_64
            pkgos: linux
            ext: tar.gz
          - os: macos-14
            name: macos-arm64
            arch: arm64
            pkgos: macos
            ext: tar.gz
          - os: windows-2022
            name: windows-amd64
            arch: x86_64
            pkgos: windows
            ext: zip

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ver=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=dev" >> "$GITHUB_OUTPUT"
          fi

      # ===================== Linux =====================
      - name: Install LLVM 18 and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev lld-18 liblld-18-dev clang-18 flex bison patchelf libstdc++-12-dev python3-pip
          sudo pip3 install pytest
          echo "LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/12" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/12" >> $GITHUB_ENV

      # ===================== macOS =====================
      - name: Install LLVM and dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm@18 flex bison
          LLVM_PREFIX="$(brew --prefix llvm@18)"
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          # LLD is bundled with llvm@18; LLDConfig.cmake is under LLVM's lib/cmake/lld
          echo "CMAKE_PREFIX_PATH=${LLVM_PREFIX}" >> $GITHUB_ENV
          echo "LLD_DIR=${LLVM_PREFIX}/lib/cmake/lld" >> $GITHUB_ENV
          pip3 install --break-system-packages pytest

      # ===================== Windows (MSVC + vcpkg) =====================
      - name: Setup MSVC developer command prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "18.1.6"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/LLVM-$version-win64.exe"
          $installer = "$env:TEMP\LLVM-$version-win64.exe"
          Write-Output "Downloading LLVM $version ..."
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          # 清除 Chocolatey 预装版（只有工具没有 CMake config）
          Remove-Item -Recurse -Force "C:\Program Files\LLVM" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\LLVM" -ErrorAction SilentlyContinue
          # 用 7-Zip 解压安装包（Inno Setup 格式，7z 可直接解压）
          Write-Output "Extracting LLVM with 7-Zip ..."
          & "C:\Program Files\7-Zip\7z.exe" x $installer -o"C:\Program Files\LLVM" -y -bso0 | Out-Null
          $llvmDir = "C:\Program Files\LLVM"
          if (-not (Test-Path "$llvmDir\lib\cmake\llvm\LLVMConfig.cmake")) {
            # 可能解压到子目录了
            $sub = Get-ChildItem "$llvmDir" -Directory -ErrorAction SilentlyContinue | Where-Object {
              Test-Path "$($_.FullName)\lib\cmake\llvm\LLVMConfig.cmake"
            } | Select-Object -First 1
            if ($sub) { $llvmDir = $sub.FullName }
            else { throw "LLVMConfig.cmake not found after extraction" }
          }
          Write-Output "LLVM ready at $llvmDir"
          echo "LLVM_DIR=$llvmDir\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$llvmDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vcpkg deps and tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install flex, bison via Chocolatey (provides win_flex.exe, win_bison.exe)
          choco install winflexbison3 -y --no-progress

          # Install libxml2 + zlib via vcpkg (静态，CMakeLists.txt 从硬编码路径链接)
          & "C:\vcpkg\vcpkg.exe" install libxml2:x64-windows-static zlib:x64-windows-static

          # Install pytest for regression tests
          pip install pytest

          # 设 VCPKG_ROOT 供 CMakeLists.txt 里的硬编码路径使用
          echo "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ===================== Configure =====================
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/lib/llvm-18

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DFLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex" \
            -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DLLVM_DIR="$env:LLVM_PATH\lib\cmake\llvm" `
            -DFLEX_EXECUTABLE="$((Get-Command win_flex).Source)" `
            -DBISON_EXECUTABLE="$((Get-Command win_bison).Source)"

      # ===================== Build =====================
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ===================== Test =====================
      - name: Smoke test — check hello.vix (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/vixc examples/hello.vix --check

      - name: Smoke test — check hello.vix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/vixc examples/hello.vix --check

      - name: Check — compile examples with ownership (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/vixc examples/pointer.vix --check
          ./build/vixc examples/fib.vix --check
          ./build/vixc examples/struct2.vix --check
          ! ./build/vixc examples/owner.vix --check

      - name: Check — compile examples with ownership (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/vixc examples/pointer.vix --check
          ./build/Release/vixc examples/fib.vix --check
          ./build/Release/vixc examples/struct2.vix --check
          ! ./build/Release/vixc examples/owner.vix --check

      - name: Regression test — pytest (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p tests/build/
          cp build/vixc tests/build/
          python3 -m pytest tests/errors.py -v --tb=short -x

      - name: Regression test — pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/build/
          Copy-Item build/Release/vixc.exe tests/build/
          python -m pytest tests/errors.py -v --tb=short -x

      # ===================== Package =====================
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          PKG_NAME="vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          mkdir -p dist
          cp build/vixc dist/vixc

          ldd dist/vixc | awk '/=>/ { print $3 }' | while read lib; do
            case "$lib" in
              /lib/*|/usr/lib/x86_64-linux-gnu/libc.*|/lib64/*|/usr/lib/x86_64-linux-gnu/libm.*|/usr/lib/x86_64-linux-gnu/libpthread.*|/usr/lib/x86_64-linux-gnu/libdl.*|/usr/lib/x86_64-linux-gnu/librt.*|/usr/lib/x86_64-linux-gnu/ld-*) continue ;;
            esac
            cp -L "$lib" dist/ 2>/dev/null || true
          done

          patchelf --set-rpath '$ORIGIN' dist/vixc
          chmod +x dist/vixc

          tar czf "${PKG_NAME}.tar.gz" -C dist .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          PKG_NAME="vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          mkdir -p dist
          cp build/vixc dist/vixc
          chmod +x dist/vixc

          LLVM_PREFIX="$(brew --prefix llvm@18)"

          for dylib in \
            "${LLVM_PREFIX}/lib/libLLVM.dylib" \
            "${LLVM_PREFIX}/lib/libLLVM-18.dylib" \
            "${LLVM_PREFIX}/lib/liblldCommon.dylib" \
            "${LLVM_PREFIX}/lib/liblldELF.dylib" \
            "${LLVM_PREFIX}/lib/liblldMachO.dylib" \
            "${LLVM_PREFIX}/lib/liblldCOFF.dylib" \
            "${LLVM_PREFIX}/lib/liblldWasm.dylib" \
            "${LLVM_PREFIX}/lib/liblldMinGW.dylib"; do
            if [ -f "$dylib" ]; then
              cp -L "$dylib" dist/ 2>/dev/null || true
            fi
          done

          otool -L dist/vixc | awk 'NR>1 { print $1 }' | while read lib; do
            case "$lib" in
              /usr/lib/*|/System/*) continue ;;
            esac
            libname="$(basename "$lib")"
            if [ ! -f "dist/${libname}" ]; then
              if [ -f "$lib" ]; then
                cp -L "$lib" dist/ 2>/dev/null || true
              fi
            fi
          done

          for f in dist/*.dylib; do
            [ -f "$f" ] || continue
            chmod +w "$f"
            otool -L "$f" | awk 'NR>1 { print $1 }' | while read dep; do
              case "$dep" in
                /usr/lib/*|/System/*) continue ;;
              esac
              depname="$(basename "$dep")"
              if [ -f "dist/${depname}" ]; then
                install_name_tool -change "$dep" "@executable_path/${depname}" "$f" 2>/dev/null || true
              fi
            done
            install_name_tool -id "@executable_path/${depname}" "$f" 2>/dev/null || true
          done

          otool -L dist/vixc | awk 'NR>1 { print $1 }' | while read dep; do
            case "$dep" in
              /usr/lib/*|/System/*) continue ;;
            esac
            depname="$(basename "$dep")"
            if [ -f "dist/${depname}" ]; then
              install_name_tool -change "$dep" "@executable_path/${depname}" dist/vixc 2>/dev/null || true
            fi
          done

          tar czf "${PKG_NAME}.tar.gz" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgName = "vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}"
          New-Item -ItemType Directory -Force -Path dist/bin | Out-Null
          Copy-Item build/Release/vixc.exe dist/bin/vixc.exe

          # Find and bundle non-system DLL dependencies via dumpbin
          $processed = [System.Collections.Generic.HashSet[string]]::new()
          $queue = [System.Collections.Queue]::new()
          $queue.Enqueue((Resolve-Path "dist/bin/vixc.exe"))

          while ($queue.Count -gt 0) {
            $binary = $queue.Dequeue()
            # Use dumpbin to list DLL dependencies (extract leading DLL names with whitespace prefix)
            $rawDeps = & dumpbin /dependents $binary 2>$null
            $dllNames = $rawDeps | Select-String '^\s+([a-zA-Z].+\.dll)$' | ForEach-Object {
              $_.Matches.Groups[1].Value.ToLower()
            }
            foreach ($dllName in $dllNames) {
              if (-not $processed.Add($dllName)) { continue }

              # Skip well-known system DLLs
              if ($dllName -in @('kernel32.dll', 'ntdll.dll', 'user32.dll', 'gdi32.dll',
                  'advapi32.dll', 'shell32.dll', 'ole32.dll', 'oleaut32.dll',
                  'comdlg32.dll', 'comctl32.dll', 'ws2_32.dll', 'bcrypt.dll',
                  'msvcrt.dll', 'shlwapi.dll', 'secur32.dll', 'crypt32.dll',
                  'winmm.dll', 'iphlpapi.dll', 'rpcrt4.dll', 'setupapi.dll',
                  'version.dll', 'winhttp.dll', 'wtsapi32.dll', 'dnsapi.dll',
                  'dbghelp.dll', 'psapi.dll', 'userenv.dll', 'netapi32.dll')) { continue }

              # Search for the DLL in PATH and adjacent directories
              $found = $false
              $searchDirs = @(
                (Split-Path $binary -Parent)
                "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\bin"
              ) + ($env:PATH -split ';')
              foreach ($dir in $searchDirs) {
                $dllPath = Join-Path $dir $dllName
                if (Test-Path $dllPath) {
                  $dest = Join-Path "dist/bin" $dllName
                  Copy-Item $dllPath $dest -Force
                  Write-Output "  Bundled: $dllName"
                  $queue.Enqueue((Resolve-Path $dest))
                  $found = $true
                  break
                }
              }
              if (-not $found) {
                Write-Output "  Skipped (not found): $dllName"
              }
            }
          }

          # Create zip (7z is available on GitHub runners)
          cd dist
          & 7z a -tzip "../${pkgName}.zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vixc-${{ matrix.name }}
          path: |
            vixc-${{ steps.version.outputs.ver }}-${{ matrix.arch }}-${{ matrix.pkgos }}.${{ matrix.ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.tar.gz
            release/**/*.zip
          generate_release_notes: true
