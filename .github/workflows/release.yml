name: Build Windows Release

on:
  push:
    tags:
      - 'vix-release-*'
  workflow_dispatch:  # 允许手动触发，方便调试

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      # 调试：查看目录结构
      - name: Debug - List files
        run: |
          echo "=== Current directory ==="
          pwd
          ls -la
          echo "=== src directory ==="
          ls -la src/ || echo "src/ not found"
        shell: bash
      
      # 安装依赖
      - name: Install dependencies
        run: |
          choco install winflexbison
          choco install llvm
        shell: bash
      
      # 调试：查看 PATH 和工具版本
      - name: Debug - Check tools
        run: |
          echo "=== PATH ==="
          echo $PATH
          echo "=== GCC ==="
          gcc --version || echo "gcc not found"
          echo "=== Make ==="
          make --version || echo "make not found"
          echo "=== Flex/Bison ==="
          flex --version || echo "flex not found"
          bison --version || echo "bison not found"
        shell: bash
      
      # 编译
      - name: Build
        run: |
          cd src
          make V=1  # V=1 会输出详细编译信息
        shell: bash
      
      # 调试：查看编译结果
      - name: Debug - Check build output
        run: |
          echo "=== src after build ==="
          ls -la src/
          echo "=== Looking for vixc.exe ==="
          find . -name "*.exe" -o -name "vixc*"
        shell: bash
      
      # 下载 Clang-18
      - name: Download Clang-18
        run: |
          curl -L -o clang-18.1.0-windows-x64.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.0/LLVM-18.1.0-win64.exe
        shell: bash
      
      # 创建 Release
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()  # 只有前面成功才创建
        with:
          files: |
            src/vixc.exe
            clang-18.1.0-windows-x64.exe
          name: Vixc ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ## Vixc 编译器 ${{ github.ref_name }}
            
            ### 🪟 Windows 用户
            - `vixc.exe` - Vixc 编译器
            - `clang-18.1.0-windows-x64.exe` - Clang-18 安装程序
            
            ### 📝 安装步骤
            1. 安装 Clang-18（双击运行）
            2. 安装 Flex/Bison：`choco install winflexbison`
            3. 将 vixc.exe 所在目录添加到 PATH
            4. 打开新的终端，运行 `vixc -v` 验证
            
            ### 🐧 Linux 用户
            Linux 用户请直接克隆源码编译：
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd Vix-lang/src
            make
            sudo make install
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}